modLoader="javafml"
loaderVersion="${loader_version}"
issueTrackerURL="https://github.com/magicbanana666/ProjectE-Phoenix/issues"
license="MIT"

[[mods]]
  modId="projecte"
  version="${version}"
  displayName="ProjectE Phoenix"
  displayURL="https://github.com/magicbanana666/ProjectE-Phoenix"
  logoFile="logo.png"
  authors="Magic Banana"
  description='''Alchemy for Minecraft: break things down into EMC, build them up again, and climb the Magnum Opus from the first false stone to the Phoenix.'''

[[dependencies.projecte]]
  modId="minecraft"
  type="required"
  versionRange="${mc_version}"
  side="BOTH"
[[dependencies.projecte]]
  modId="neoforge"
  type="required"
  versionRange="${neo_version}"
  side="BOTH"

[[dependencies.projecte]]
modId="mekanism"
type="incompatible"
reason="Requires an update to support changes to recipe mappers"
versionRange="[,10.7.8]"
side="BOTH"
