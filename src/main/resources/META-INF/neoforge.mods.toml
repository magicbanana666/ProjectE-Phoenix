modLoader="javafml"
loaderVersion="${loader_version}"
issueTrackerURL="https://github.com/magicbanana666/ProjectE-Phoenix/issues"
license="MIT"

[[mods]]
  modId="projecte"
  version="${version}"
  displayName="ProjectE Phoenix"
  displayURL="https://github.com/magicbanana666/ProjectE-Phoenix"
  logoFile="logo.png"
  authors="SinKillerJ, MaPePeR, williewillus, Lilylicious, pupnewfster"
  credits="ProjectExtended - pupnewfster, Project Expansion - DonovanDMC, ProjectE Integration - TagnumElite, Mekanism ProjectE mappers - Aidan C. Brady and the Mekanism team, 26.1 port - UnQuis, EE2 creator - x3n0ph0b3, EE2 GUI Textures - MidnightLightning, Former Texture Artist - Magic Banana"
  description='''A complete rewrite of EE2 for modern Minecraft versions.
Phoenix edition: an unofficial port to Minecraft 26.1.2 with ProjectExtended, Project Expansion, ProjectE Integration and the Mekanism EMC mappers built in.'''

[[dependencies.projecte]]
  modId="minecraft"
  type="required"
  versionRange="${mc_version}"
  side="BOTH"
[[dependencies.projecte]]
  modId="neoforge"
  type="required"
  versionRange="${neo_version}"
  side="BOTH"

[[dependencies.projecte]]
modId="mekanism"
type="incompatible"
reason="Requires an update to support changes to recipe mappers"
versionRange="[,10.7.8]"
side="BOTH"
