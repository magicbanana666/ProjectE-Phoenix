# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx4G
org.gradle.configuration-cache=true

projecte_version=1.2.0-beta2
minecraft_version=26.1.2
#Used as a helper for porting when deps we use have not updated yet
previous_minecraft_version=1.21.1
previous_minor_minecraft_version=26.1
loader_version_range=[11,)
neo_version=26.1.2.115
# This determines the minimum version of NeoForge required to use ProjectE
# Only bump it whenever we need access to a feature in NeoForge that is not available in earlier versions
neo_version_range=[26.1.2,)
minecraft_version_range=[26.1.2]

junit_version=5.13.4

#Parchment settings
#No parchment mappings are published for 26.1.x yet, so we fall back to plain Mojang mappings
#neoForge.parchment.minecraftVersion=26.1.2
#neoForge.parchment.mappingsVersion=2026.11.1

#misc settings
# recipe viewer, currently accepts: jei, emi, hybrid
recipe_viewer=jei

# Mod dependency versions
#CraftTweaker/EMI have not been ported to 26.x yet, their integrations are disabled on this branch
curios_version=15.0.0+26.1.2
jade_version=26.1.11+neoforge
jei_version=29.40.0.101
gamestages_version=17.0.1
top_version=26.1.2_neo-14.0.0-1
wthit_version=19.0.1

